apiVersion: v1
kind: Service
metadata:
  name: {{ include "antkart-service.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "antkart-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "antkart-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
