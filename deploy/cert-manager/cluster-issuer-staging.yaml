# Let's Encrypt STAGING ClusterIssuer.
#
# USE THIS FIRST. Staging has generous rate limits, so it is safe to iterate while
# validating the end-to-end flow (ingress -> HTTP-01 challenge -> certificate). Staging
# certificates are signed by an UNTRUSTED root, so browsers/curl will warn — that is
# expected; use `curl -k` to verify. Only switch the Ingress to letsencrypt-prod once
# staging issues a Ready certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # REQUIRED — REPLACE BEFORE APPLYING. Let's Encrypt sends certificate-expiry
    # and abuse notices to this address, so it must be one somebody reads. It is a
    # deliberate placeholder rather than a real address: an email address is
    # personal data and this repository is written to be published.
    email: you@example.com
    # Where the ACME account private key is stored (created on first use).
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # HTTP-01: cert-manager proves domain control by serving a token over HTTP on
      # the ingress. It needs a public hostname already pointed at the controller's
      # LoadBalancer IP — either your own domain, or a <public-ip>.nip.io fallback
      # if you have no domain to hand.
      - http01:
          ingress:
            class: nginx
