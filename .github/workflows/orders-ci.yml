# =============================================================================
# Orders CI
# =============================================================================
# A thin caller. All the logic lives in _dotnet-ci.yml — see that file for why.
#
# ORDERS SPECIFICS:
# The HITL gate lives here (D6). A proposed order that can be committed without
# a confirmation is the defect this suite exists to catch.

name: Orders CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'AK.Orders/**'
      - 'AK.BuildingBlocks/**'
      - 'nuget.config'
      - '.github/workflows/orders-ci.yml'
      - '.github/workflows/_dotnet-ci.yml'
      # Documentation-only changes do not trigger the gate. The negation must be
      # LAST — in GitHub Actions path filters, later patterns win.
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: orders-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_dotnet-ci.yml
    with:
      service_name: orders
      service_path: AK.Orders
      project: AK.Orders/AK.Orders.API/AK.Orders.API.csproj
      test_project: 'AK.Orders/AK.Orders.Tests/AK.Orders.Tests.csproj'
      dockerfile: AK.Orders/AK.Orders.API/Dockerfile
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
